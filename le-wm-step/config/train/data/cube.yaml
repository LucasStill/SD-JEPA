dataset:
  name: cube_single_expert
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels
    - action
    - observation
    - step_idx           # required when loss.proto.mode='first_anchor'; ignored otherwise
  keys_to_cache:
    - action
    - observation
    - step_idx
  keys_to_merge:
    proprio: proprio
